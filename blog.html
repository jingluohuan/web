<section class="section">
  <div class="container">
    <div class="blog-layout">
      <main class="blog-main">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索文章标题、内容或标签..." class="search-input">

        <div class="active-filter" id="activeFilter" style="display:none"></div>
        <div class="search-results-info" id="searchInfo"></div>
        <div class="posts-list" id="postsList"></div>
        <div class="no-results" id="noResults" style="display:none">

          <p>换个关键词试试吧</p>

      <aside class="blog-sidebar">
        <div class="widget">
          <h3>🔍 搜索</h3>
          <input type="text" id="sidebarSearch" placeholder="搜索文章..." class="search-input">
        </div>
        <div class="widget">
          <h3>📂 分类</h3>
          <ul class="cat-list" id="catList"></ul>
        </div>
        <div class="widget">
          <h3>🏷️ 标签云</h3>
          <div class="tag-cloud" id="tagCloud"></div>
        </div>
        <div class="widget">
          <h3>🔥 最新文章</h3>
          <ul class="recent-list" id="recentList"></ul>
        </div>
